name: Gazelle Second Seat Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TZ: America/Toronto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check stock and send Telegram
        shell: bash
        run: |
          set +e

          if [ -f counter.txt ]; then
            COUNT=$(cat counter.txt)
          else
            COUNT=0
          fi

          COUNT=$((COUNT + 1))
          echo "Проверка номер $COUNT"

          SEARCH_URL="https://fromrebel.com/search?q=Gazelle+second+seat"
          echo "Проверяем HTML поиска"

          curl -sL "$SEARCH_URL" -H "User-Agent: Mozilla/5.0" -o search_page.html

          FOUND=false
          MATCH_TEXT=""

          if [ ! -s search_page.html ]; then
            echo "Не удалось получить страницу поиска"
          else
            SIZE=$(wc -c < search_page.html)
            echo "HTML получен, размер: $SIZE"

            tr '\n' ' ' < search_page.html > one_line.html
            sed 's/Add to Cart/\nAdd to Cart/g; s/Sold Out/\nSold Out/g' one_line.html > chunks.txt

            while IFS= read -r CHUNK; do
              [ -z "$CHUNK" ] && continue

              if echo "$CHUNK" | grep -iq "gazelle" && echo "$CHUNK" | grep -iq "second seat"; then
                echo "Найден фрагмент second seat"

                if echo "$CHUNK" | grep -iq "Sold Out"; then
                  echo "Во фрагменте указано Sold Out"
                  continue
                fi

                if echo "$CHUNK" | grep -Eiq "Add to Cart|Only [0-9]+ Left!|Only [0-9]+ left!"; then
                  FOUND=true
                  MATCH_TEXT="Найден second seat с признаком наличия в одном блоке товара"
                  echo "Найден товар в наличии"
                  break
                fi
              fi
            done < chunks.txt
          fi

          CURRENT_HOUR=$(date +%H)
          CURRENT_MIN=$(date +%M)
          CURRENT_TIME=$(date "+%Y-%m-%d %H:%M:%S %Z")

          IS_REPORT_TIME=false

          if [ "$CURRENT_HOUR" = "06" ] && [ "$CURRENT_MIN" = "30" ]; then
            IS_REPORT_TIME=true
          fi

          if [ "$CURRENT_HOUR" = "16" ] && [ "$CURRENT_MIN" = "30" ]; then
            IS_REPORT_TIME=true
          fi

          TELEGRAM
