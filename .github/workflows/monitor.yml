name: Gazelle Second Seat Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TZ: America/Toronto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check stock and send Telegram
        shell: bash
        run: |
          set +e

          if [ -f counter.txt ]; then
            COUNT=$(cat counter.txt)
          else
            COUNT=0
          fi

          COUNT=$((COUNT + 1))
          echo "Проверка номер $COUNT"

          SEARCH_URL="https://fromrebel.com/search?q=Gazelle+second+seat"
          echo "Проверяем HTML поиска"

          curl -sL "$SEARCH_URL" -H "User-Agent: Mozilla/5.0" -o search_page.html

          FOUND=false
          MATCH_TEXT=""

          if [ ! -s search_page.html ]; then
            echo "Не удалось получить страницу поиска"
          else
            SIZE=$(wc -c < search_page.html)
            echo "HTML получен, размер: $SIZE"

            if grep -Eiq 'Gazelle S 2 Second Seat|Second Seat for Gazelle|Gazelle.*Second Seat|Second Seat.*Gazelle' search_page.html; then
              echo "Найден текст Gazelle Second Seat"

              if grep -Eiq 'Only 1 Left!|Only 2 Left!|Add to Cart' search_page.html; then
                FOUND=true
                MATCH_TEXT="Gazelle Second Seat найден на странице поиска с признаком наличия"
                echo "Найден признак наличия"
              else
                echo "Признак наличия не найден"
              fi
            else
              echo "Gazelle Second Seat на странице не найден"
            fi
          fi

          CURRENT_HOUR=$(date +%H)
          CURRENT_MIN=$(date +%M)
          CURRENT_TIME=$(date "+%Y-%m-%d %H:%M:%S %Z")

          IS_REPORT_TIME=false

          if [ "$CURRENT_HOUR" = "06" ] && [ "$CURRENT_MIN" = "30" ]; then
            IS_REPORT_TIME=true
          fi

          if [ "$CURRENT_HOUR" = "16" ] && [ "$CURRENT_MIN" = "30" ]; then
            IS_REPORT_TIME=true
          fi

          TELEGRAM_MSG=""
          NEW_COUNT=$COUNT

          if [ "$FOUND" = true ]; then
            TELEGRAM_MSG="🚨 Gazelle Second Seat в наличии!
            🔗 $SEARCH_URL
            📝 $MATCH_TEXT
            📅 $CURRENT_TIME"

            NEW_COUNT=0
          elif [ "$IS_REPORT_TIME" = true ]; then
            TELEGRAM_MSG="📊 Отчет о поиске%0A🔍 Проверок с последнего сообщения: $COUNT%0A📅 $CURRENT_TIME"
            NEW_COUNT=0
          fi

          echo "$NEW_COUNT" > counter.txt
          echo "Счетчик сохранен: $NEW_COUNT"

          if [ -n "$TELEGRAM_MSG" ]; then
            echo "Отправка сообщения в Telegram"

            TG_RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TG_CHAT_ID" \
              --data-urlencode "text=$TELEGRAM_MSG")

            echo "$TG_RESPONSE"

            if echo "$TG_RESPONSE" | grep -q '"ok":true'; then
              echo "Сообщение отправлено"
            else
              echo "Ошибка отправки в Telegram"
            fi
          else
            echo "Сообщение не отправляем"
          fi

      - name: Commit updated counter
        shell: bash
        run: |
          if [ ! -f counter.txt ]; then
            echo "counter.txt не существует"
            exit 0
          fi

          if git diff --quiet counter.txt; then
            echo "Нет изменений в counter.txt"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add counter.txt
          git commit -m "Update counter"
          git push
